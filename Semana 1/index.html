
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Proyecto Web</title>
    <style>
        /* Estilos para los cuadros tipo formulario */
        .cuadro-formulario {
            max-width: 600px;       /* Controla qué tan cortos/anchos son los cuadros */
            margin: 0 auto 25px auto; /* Centra los cuadros y añade distancia entre ellos */
            border: 2px solid #ccc; /* Borde del cuadro */
            border-radius: 6px;     /* Esquinas redondeadas */
            padding: 15px;          /* Espacio interno para el texto */
            background-color: #f9f9f9; /* Color de fondo suave */
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05); /* Sombra sutil */
        }

        /* Ajustes para que los textos se adapten bien al cuadro */
        h1, h2, h3, h4, h5, h6 {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;     /* Centra el texto dentro del cuadro */
        }
        
        h1 { font-size: 24px; color: #333; }
        h2 { font-size: 18px; color: #555; font-weight: normal; }
        h3 { font-size: 16px; color: #666; font-weight: normal; }
        h4 { font-size: 15px; color: #777; font-weight: normal; }
        h5 { font-size: 14px; color: #888; font-weight: normal; }
        h6 { font-size: 13px; color: #999; font-weight: normal; }
    </style>
</head>
<body>

    <!-- Cuadro 1: Título Principal -->
    <div class="cuadro-formulario">
        <h1>Sistema de Gestión de Ventas XYZ</h1>
    </div>

    <!-- Cuadro 2: Subtítulo / Propósito -->
    <div class="cuadro-formulario">
        <h2>Plataforma para administrar clientes, productos y facturación</h2>
    </div>

    <!-- Cuadro 3: Desarrollador -->
    <div class="cuadro-formulario">
        <h3>Desarrollado por Ronald Pullotasig</h3>
    </div>

    <!-- Cuadro 4: Carrera -->
    <div class="cuadro-formulario">
        <h4>Carrera: Tecnologías de la Información</h4>
    </div>

    <!-- Cuadro 5: Asignatura -->
    <div class="cuadro-formulario">
        <h5>Asignatura: Desarrollo de aplicaciones Web</h5>
    </div>

    <!-- Cuadro 6: Periodo Académico -->
    <div class="cuadro-formulario">
        <h6>Periodo académico 2026</h6>
    </div>

</body>
</html>
