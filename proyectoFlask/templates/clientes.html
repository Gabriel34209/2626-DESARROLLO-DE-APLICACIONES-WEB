{% extends "base.html" %}

{% block title %}Clientes - Coca-Cola{% endblock %}

{% block content %}
<h2 class="mb-4 text-danger">Módulo de Clientes</h2>
<ul class="list-group shadow-sm">
    {% for cli in clientes %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-1">{{ cli.nombre }}</h5>
            <small class="text-muted">Contacto: {{ cli.contacto }}</small>
        </div>
        <span class="badge bg-danger rounded-pill">{{ cli.ciudad }}</span>
    </li>
    {% endfor %}
</ul>
{% endblock %}
